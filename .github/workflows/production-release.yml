name: Production Release & Canary Promotion

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Immutable 40-character Git commit SHA verified in staging"
        required: true
        type: string
      canary_initial_weight:
        description: "Initial Canary traffic percentage (5 or 25)"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "25"

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-provenance:
    name: Validate Provenance, SBOM & Migrations
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout Source at Verified SHA
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Validate Immutable SHA (Reject Mutable Tags)
        run: |
          SHA="${{ github.event.inputs.source_sha }}"
          echo "Validating release tag / commit SHA: ${SHA}"
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release SHA '${SHA}' is invalid. Production releases strictly require an immutable 40-character commit SHA."
            exit 1
          fi
          if [[ "${SHA}" =~ ^(latest|staging|production|main|master)$ ]]; then
            echo "::error::Mutable tag '${SHA}' rejected."
            exit 1
          fi

      - name: Verify Immutable Image Manifests & Extract Digests
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.inputs.source_sha }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod +x infra/deploy/production/verify-provenance.sh
          ./infra/deploy/production/verify-provenance.sh "${SHA}" "artifacts/provenance/image-digests.json"

      - name: Upload Verified Image Digests
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: flowdesk-image-digests-${{ github.event.inputs.source_sha }}
          path: artifacts/provenance/image-digests.json
          retention-days: 90

      - name: Validate Database Expand Compatibility
        run: |
          chmod +x infra/deploy/production/validate-migrations.sh
          ./infra/deploy/production/validate-migrations.sh

      - name: Generate Real SPDX-2.3 SBOM
        run: |
          chmod +x infra/deploy/production/generate-sbom.sh
          ./infra/deploy/production/generate-sbom.sh "${{ github.event.inputs.source_sha }}"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: flowdesk-sbom-${{ github.event.inputs.source_sha }}
          path: artifacts/sbom/
          retention-days: 90

  canary-deployment-5pct:
    name: Deploy Canary Workload & 5% Traffic Slice
    needs: validate-provenance
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout Source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Download Verified Image Digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flowdesk-image-digests-${{ github.event.inputs.source_sha }}
          path: artifacts/provenance/

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d47d11f562b7db7 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          role-session-name: FlowDesk-Production-Canary-5pct

      - name: Deploy Verified Image Digests to Canary Workload
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || vars.ECS_CLUSTER_NAME || 'flowdesk-production-cluster' }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_CANARY_SERVICE_NAME || vars.ECS_CANARY_SERVICE_NAME || 'flowdesk-production-canary-api' }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          chmod +x infra/deploy/production/deploy-workload.sh
          ./infra/deploy/production/deploy-workload.sh canary "artifacts/provenance/image-digests.json"

      - name: Verify Running Canary Workload Digest & Target Health
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || vars.ECS_CLUSTER_NAME || 'flowdesk-production-cluster' }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_CANARY_SERVICE_NAME || vars.ECS_CANARY_SERVICE_NAME || 'flowdesk-production-canary-api' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          chmod +x infra/deploy/production/verify-workload.sh
          ./infra/deploy/production/verify-workload.sh canary "artifacts/provenance/image-digests.json"

      - name: Shift Traffic to Canary (5% Weight)
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 5

      - name: Evaluate Canary Health & SLO Gate (5% Slice)
        env:
          CANARY_ENDPOINT_URL: ${{ vars.CANARY_ENDPOINT_URL || secrets.CANARY_ENDPOINT_URL }}
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || secrets.PROMETHEUS_URL }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          EVALUATE_CLOUDWATCH_METRICS: "true"
        run: |
          chmod +x infra/deploy/production/evaluate-canary-gate.sh
          ./infra/deploy/production/evaluate-canary-gate.sh 5

      - name: Automated Rollback on Canary 5% Failure
        if: failure()
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          FAILED_STAGE: "canary_5pct"
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          echo "Canary 5% health probe or SLO gate failed. Executing immediate rollback to stable slice..."
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 0
          chmod +x infra/deploy/production/record-deployment.sh
          ./infra/deploy/production/record-deployment.sh "${{ github.event.inputs.source_sha }}" "rolled_back" "${{ github.actor }}" "production-deployment-record.json"

      - name: Upload Rollback Deployment Record
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: production-deployment-${{ github.event.inputs.source_sha }}-rollback-5pct
          path: production-deployment-record.json
          retention-days: 90

  canary-deployment-25pct:
    name: Canary Slice (25% Traffic & SLO Gate)
    needs: canary-deployment-5pct
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout Source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Download Verified Image Digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flowdesk-image-digests-${{ github.event.inputs.source_sha }}
          path: artifacts/provenance/

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d47d11f562b7db7 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          role-session-name: FlowDesk-Production-Canary-25pct

      - name: Advance Canary Slice (25% Weight)
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 25

      - name: Evaluate Canary Health & SLO Gate (25% Slice)
        env:
          CANARY_ENDPOINT_URL: ${{ vars.CANARY_ENDPOINT_URL || secrets.CANARY_ENDPOINT_URL }}
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || secrets.PROMETHEUS_URL }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          EVALUATE_CLOUDWATCH_METRICS: "true"
        run: |
          chmod +x infra/deploy/production/evaluate-canary-gate.sh
          ./infra/deploy/production/evaluate-canary-gate.sh 25

      - name: Automated Rollback on Canary 25% Failure
        if: failure()
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          FAILED_STAGE: "canary_25pct"
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          echo "Canary 25% SLO or health probe failed. Executing immediate rollback to stable slice..."
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 0
          chmod +x infra/deploy/production/record-deployment.sh
          ./infra/deploy/production/record-deployment.sh "${{ github.event.inputs.source_sha }}" "rolled_back" "${{ github.actor }}" "production-deployment-record.json"

      - name: Upload Rollback Deployment Record
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: production-deployment-${{ github.event.inputs.source_sha }}-rollback-25pct
          path: production-deployment-record.json
          retention-days: 90

  full-production-promote:
    name: Full Production Promotion & Stable Catchup
    needs: canary-deployment-25pct
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout Source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Download Verified Image Digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flowdesk-image-digests-${{ github.event.inputs.source_sha }}
          path: artifacts/provenance/

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d47d11f562b7db7 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          role-session-name: FlowDesk-Production-Promote-100pct

      - name: Shift Traffic to 100% Canary
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 100

      - name: Evaluate Canary Health at 100% Traffic
        env:
          CANARY_ENDPOINT_URL: ${{ vars.CANARY_ENDPOINT_URL || secrets.CANARY_ENDPOINT_URL }}
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || secrets.PROMETHEUS_URL }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          EVALUATE_CLOUDWATCH_METRICS: "true"
        run: |
          chmod +x infra/deploy/production/evaluate-canary-gate.sh
          ./infra/deploy/production/evaluate-canary-gate.sh 100

      - name: Deploy Verified Image Digests to Stable Workload (Catchup)
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || vars.ECS_CLUSTER_NAME || 'flowdesk-production-cluster' }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_STABLE_SERVICE_NAME || vars.ECS_STABLE_SERVICE_NAME || 'flowdesk-production-stable-api' }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          echo "Promoting verified release to permanent stable production workload..."
          chmod +x infra/deploy/production/deploy-workload.sh
          ./infra/deploy/production/deploy-workload.sh stable "artifacts/provenance/image-digests.json"

      - name: Verify Running Stable Workload Digests
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || vars.ECS_CLUSTER_NAME || 'flowdesk-production-cluster' }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_STABLE_SERVICE_NAME || vars.ECS_STABLE_SERVICE_NAME || 'flowdesk-production-stable-api' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          chmod +x infra/deploy/production/verify-workload.sh
          ./infra/deploy/production/verify-workload.sh stable "artifacts/provenance/image-digests.json"

      - name: Reset Traffic Distribution to 100% Stable (Catchup Complete)
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          echo "Resetting traffic distribution to 100% stable / 0% canary..."
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 0

      - name: Automated Rollback on Full Promotion / Catchup Failure
        if: failure()
        env:
          PROD_LISTENER_ARN: ${{ secrets.PROD_LISTENER_ARN || vars.PROD_LISTENER_ARN }}
          PROD_RULE_ARN: ${{ secrets.PROD_RULE_ARN || vars.PROD_RULE_ARN }}
          PROD_STABLE_TG_ARN: ${{ secrets.PROD_STABLE_TG_ARN || vars.PROD_STABLE_TG_ARN }}
          PROD_CANARY_TG_ARN: ${{ secrets.PROD_CANARY_TG_ARN || vars.PROD_CANARY_TG_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          FAILED_STAGE: "full_promotion"
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          echo "Full promotion, 100% canary SLO evaluation, or stable catchup failed. Executing immediate rollback to 100% stable slice..."
          chmod +x infra/deploy/production/canary-traffic.sh
          ./infra/deploy/production/canary-traffic.sh 0
          chmod +x infra/deploy/production/record-deployment.sh
          ./infra/deploy/production/record-deployment.sh "${{ github.event.inputs.source_sha }}" "rolled_back" "${{ github.actor }}" "production-deployment-record.json"

      - name: Upload Rollback Deployment Record
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: production-deployment-${{ github.event.inputs.source_sha }}-rollback-100pct
          path: production-deployment-record.json
          retention-days: 90

      - name: Generate Production Deployment Record
        env:
          DIGESTS_FILE: "artifacts/provenance/image-digests.json"
        run: |
          chmod +x infra/deploy/production/record-deployment.sh
          ./infra/deploy/production/record-deployment.sh "${{ github.event.inputs.source_sha }}" "promoted" "${{ github.actor }}" "production-deployment-record.json"

      - name: Upload Production Deployment Record
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: production-deployment-${{ github.event.inputs.source_sha }}
          path: production-deployment-record.json
          retention-days: 90
