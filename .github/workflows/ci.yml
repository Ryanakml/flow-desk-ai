name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_failure_probe:
        description: "Prove a deliberate failure blocks the workflow"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { run_install: false }
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Conventional pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
      - run: pnpm format:check
      - run: pnpm openapi:check
      - name: Changed workspace evidence
        run: node scripts/changed-workspaces.mjs | tee changed-workspaces.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/scan-secrets.mjs
      - name: Deliberate failure probe
        if: ${{ inputs.run_failure_probe == true }}
        run: exit 42
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: quality-evidence
          path: |
            changed-workspaces.json
            **/coverage
            **/dist
          retention-days: 14

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            port: 4000
          - app: ingress
            port: 4001
          - app: worker
            port: 4002
          - app: scheduler
            port: 4003
          - app: web
            port: 3000
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Build non-root image
        run: docker build -f infra/docker/Dockerfile.node --build-arg APP=${{ matrix.app }} -t flowdesk/${{ matrix.app }}:${{ github.sha }} .
      - name: Smoke test image
        run: |
          docker run -d --name app -e PORT=${{ matrix.port }} -p ${{ matrix.port }}:${{ matrix.port }} flowdesk/${{ matrix.app }}:${{ github.sha }}
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:${{ matrix.port }}/livez && exit 0; sleep 1; done
          docker logs app
          exit 1

  database-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16-bookworm
        env:
          POSTGRES_DB: flowdesk_test
          POSTGRES_USER: flowdesk_test
          POSTGRES_PASSWORD: flowdesk_test_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowdesk_test -d flowdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATOR_URL: postgresql://flowdesk_test:flowdesk_test_local@localhost:5432/flowdesk_test
      DATABASE_URL: postgresql://flowdesk_test:flowdesk_test_local@localhost:5432/flowdesk_test
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { run_install: false }
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowdesk/db test:integration
      - run: pnpm --filter @flowdesk/worker test:integration

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.13.1 }
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -reconfigure
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform plan -refresh=false -input=false -var-file=environments/local/local.tfvars
