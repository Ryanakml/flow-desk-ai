name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_failure_probe:
        description: "Prove a deliberate failure blocks the workflow"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Conventional pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
      - run: pnpm format:check
      - run: pnpm openapi:check
      - name: Changed workspace evidence
        run: node scripts/changed-workspaces.mjs | tee changed-workspaces.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/scan-secrets.mjs
      - name: Deliberate failure probe
        if: ${{ inputs.run_failure_probe == true }}
        run: exit 42
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: quality-evidence
          path: |
            changed-workspaces.json
            **/coverage
            **/dist
          retention-days: 14

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            workspace: api
            port: 4000
            smoke: true
          - app: ingress
            workspace: ingress
            port: 4001
            smoke: true
          - app: worker
            workspace: worker
            port: 4002
            smoke: true
          - app: scheduler
            workspace: scheduler
            port: 4003
            smoke: true
          - app: web
            workspace: web
            port: 3000
            smoke: true
          - app: migrator
            workspace: db
            port: 0
            smoke: false
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up BuildKit
        run: docker buildx create --driver docker-container --use
      - name: Build cached non-root image
        run: |
          docker buildx build \
            --file infra/docker/Dockerfile.node \
            --build-arg APP=${{ matrix.workspace }} \
            --tag flowdesk/${{ matrix.app }}:${{ github.sha }} \
            --cache-from type=gha,scope=flowdesk-${{ matrix.app }} \
            --cache-to type=gha,mode=max,scope=flowdesk-${{ matrix.app }} \
            --load \
            .
      - name: Smoke test image
        if: matrix.smoke
        run: |
          docker run -d --name app -e PORT=${{ matrix.port }} -p ${{ matrix.port }}:${{ matrix.port }} flowdesk/${{ matrix.app }}:${{ github.sha }}
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:${{ matrix.port }}/livez && exit 0; sleep 1; done
          docker logs app
          exit 1
      - name: Publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag flowdesk/${{ matrix.app }}:${{ github.sha }} ghcr.io/ryanakml/flowdesk-${{ matrix.app }}:${{ github.sha }}
          docker push ghcr.io/ryanakml/flowdesk-${{ matrix.app }}:${{ github.sha }}

  database-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16-bookworm
        env:
          POSTGRES_DB: flowdesk_test
          POSTGRES_USER: flowdesk_test
          POSTGRES_PASSWORD: flowdesk_test_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowdesk_test -d flowdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATOR_URL: postgresql://flowdesk_test:flowdesk_test_local@localhost:5432/flowdesk_test
      DATABASE_URL: postgresql://flowdesk_test:flowdesk_test_local@localhost:5432/flowdesk_test
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@flowdesk/worker...
      - run: pnpm --filter @flowdesk/db test:integration
      - run: pnpm --filter @flowdesk/worker test:integration

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.13.1 }
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -reconfigure
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform plan -refresh=false -input=false -var-file=environments/local/local.tfvars

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, images, database-foundation, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.STAGING_SSH_HOST_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
      - name: Upload immutable release manifest
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
        run: |
          release_dir=/opt/flowdesk/releases/${GITHUB_SHA}
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release_dir}'"
          scp \
            infra/deploy/digitalocean/compose.yaml \
            infra/deploy/digitalocean/Caddyfile \
            infra/deploy/digitalocean/provision-runtime.sql \
            infra/deploy/digitalocean/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${release_dir}/"
      - name: Deploy with migration, health gate, and rollback
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          cleanup_registry_login() {
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "docker logout ghcr.io >/dev/null 2>&1 || true"
          }
          trap cleanup_registry_login EXIT
          printf '%s' "$GHCR_TOKEN" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '/opt/flowdesk/releases/${GITHUB_SHA}' && chmod 0750 deploy.sh && ./deploy.sh '${GITHUB_SHA}'"
      - name: Public smoke test
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
        run: |
          curl --fail --show-error --silent --retry 10 --retry-all-errors "http://${DEPLOY_HOST}/livez"
          curl --fail --show-error --silent --retry 10 --retry-all-errors "http://${DEPLOY_HOST}/api/v1/system/build" | tee deployment-record.json
          grep -q "${GITHUB_SHA}" deployment-record.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: staging-deployment-${{ github.sha }}
          path: deployment-record.json
          if-no-files-found: warn
          retention-days: 30
