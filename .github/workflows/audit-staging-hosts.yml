name: Audit staging hosts

on:
  workflow_dispatch:
  push:
    branches: [chore/aws-ec2-single-host]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Configure pinned SSH identities
        env:
          OLD_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          OLD_SSH_HOST_KEY: ${{ vars.STAGING_SSH_HOST_KEY }}
          NEW_SSH_PRIVATE_KEY: ${{ secrets.AWS_STAGING_SSH_PRIVATE_KEY }}
          NEW_SSH_HOST_KEY: ${{ vars.AWS_STAGING_SSH_HOST_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$OLD_SSH_PRIVATE_KEY" > ~/.ssh/old_staging
          printf '%s\n' "$NEW_SSH_PRIVATE_KEY" > ~/.ssh/aws_staging
          chmod 0600 ~/.ssh/old_staging ~/.ssh/aws_staging
          printf '%s\n%s\n' "$OLD_SSH_HOST_KEY" "$NEW_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Audit old staging state
        env:
          SSH_HOST: ${{ vars.STAGING_HOST }}
          SSH_USER: ${{ vars.STAGING_USER }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/old_staging -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          current_file=/opt/flowdesk/shared/current-image
          environment_file=/opt/flowdesk/shared/staging.env
          test -s "$current_file"
          test -s "$environment_file"
          image_tag=$(<"$current_file")
          [[ $image_tag =~ ^[0-9a-f]{40}$ ]]
          release_dir=/opt/flowdesk/releases/$image_tag
          cd "$release_dir"
          export IMAGE_TAG=$image_tag
          compose=(docker compose --env-file "$environment_file" -f compose.yaml)
          echo "old.active_sha=$image_tag"
          echo "old.environment=$(stat -c '%a %U:%G' "$environment_file")"
          "${compose[@]}" ps --format 'table {{.Service}}\t{{.Status}}'
          echo "old.database_bytes=$("${compose[@]}" exec -T postgres psql --username "$(sed -n 's/^POSTGRES_USER=//p' "$environment_file" | head -n1)" --dbname "$(sed -n 's/^POSTGRES_DB=//p' "$environment_file" | head -n1)" --tuples-only --no-align --command 'select pg_database_size(current_database())')"
          echo "old.minio_bytes=$("${compose[@]}" exec -T minio sh -c 'du -sb /data | cut -f1')"
          docker system df
          REMOTE

      - name: Audit AWS staging prerequisites
        env:
          SSH_HOST: ${{ vars.AWS_STAGING_HOST }}
          SSH_USER: ${{ vars.AWS_STAGING_USER }}
          SSH_PORT: ${{ vars.AWS_STAGING_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/aws_staging -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo "new.os=$(source /etc/os-release; printf '%s %s' "$NAME" "$VERSION_ID")"
          echo "new.arch=$(uname -m)"
          echo "new.docker=$(docker --version)"
          echo "new.compose=$(docker compose version)"
          echo "new.root_free_bytes=$(df --output=avail -B1 / | tail -n1 | tr -d ' ')"
          echo "new.memory_available_bytes=$(awk '/MemAvailable:/ {print $2 * 1024}' /proc/meminfo)"
          stat -c 'new.path=%a %U:%G %n' /opt/flowdesk/releases /opt/flowdesk/shared
          test ! -e /opt/flowdesk/shared/staging.env
          test -z "$(docker volume ls --quiet --filter name=flowdesk-staging_)"
          REMOTE
