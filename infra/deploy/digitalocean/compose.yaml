name: flowdesk-staging

x-app-environment: &app-environment
  NODE_ENV: production
  APP_ENV: staging
  SERVICE_VERSION: ${IMAGE_TAG:?IMAGE_TAG is required}
  GIT_SHA: ${IMAGE_TAG:?IMAGE_TAG is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: "postgresql://flowdesk_app:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  S3_BUCKET: flowdesk-staging
  S3_REGION: sgp1
  S3_ENDPOINT: "http://minio:9000"
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
  AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID}
  AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET}
  AUTH_OIDC_REDIRECT_URI: "${PUBLIC_BASE_URL}/api/v1/auth/callback"
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED:-true}
  APP_BASE_URL: ${PUBLIC_BASE_URL}
  WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
  WEBHOOK_APP_SECRET: ${WEBHOOK_APP_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [application]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
    clamav: { condition: service_healthy }
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'node -e "fetch(''http://127.0.0.1:''+(process.env.PORT||4000)+''/livez'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"'
      ]
    interval: 5s
    timeout: 3s
    start_period: 5s
    retries: 5

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, application]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      ingress: { condition: service_healthy }

  web:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY}/flowdesk-web:${IMAGE_TAG}
    environment:
      <<: *app-environment
      PORT: "3000"

  api:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY}/flowdesk-api:${IMAGE_TAG}
    environment:
      <<: *app-environment
      PORT: "4000"

  ingress:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY}/flowdesk-ingress:${IMAGE_TAG}
    environment:
      <<: *app-environment
      PORT: "4001"

  worker:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY}/flowdesk-worker:${IMAGE_TAG}
    environment:
      <<: *app-environment
      PORT: "4002"

  scheduler:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY}/flowdesk-scheduler:${IMAGE_TAG}
    environment:
      <<: *app-environment
      PORT: "4003"

  postgres:
    image: pgvector/pgvector:0.8.0-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-bookworm
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory-policy,
        noeviction,
        --requirepass,
        "${REDIS_PASSWORD}"
      ]
    volumes: ["redis-data:/data"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/data"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        mc alias set staging http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing staging/flowdesk-staging
    networks: [application]
    security_opt: ["no-new-privileges:true"]

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes: ["clamav-data:/var/lib/clamav"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, /usr/local/bin/clamdcheck.sh]
      interval: 15s
      timeout: 5s
      retries: 40

  migrate:
    image: ${IMAGE_REGISTRY}/flowdesk-migrator:${IMAGE_TAG}
    restart: "no"
    environment:
      DATABASE_MIGRATOR_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    command: [node, scripts/migrate.mjs]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    profiles: [release]

networks:
  edge:
  application:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
  caddy-data:
  caddy-config:
