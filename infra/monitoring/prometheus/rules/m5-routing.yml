groups:
  - name: flowdesk_m5_slo_alerts
    rules:
      - alert: FlowDeskWebhookLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route="/api/v1/webhooks/whatsapp"}[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: p2
          owner: messaging
        annotations:
          summary: "Inbound webhook p99 latency exceeds 500ms SLO target"
          description: "WhatsApp inbound webhook p99 latency is greater than 500ms over 5m window, consuming webhook SLO error budget."
          runbook: "docs/operations/provider-outage-playbook.md"

      - alert: FlowDeskAutoSendFailureRateHigh
        expr: sum(rate(auto_send_failures_total[5m])) / (sum(rate(auto_send_total[5m])) > 0 or 1) > 0.001
        for: 1m
        labels:
          severity: p1
          owner: automation
        annotations:
          summary: "Auto-send error rate exceeds 0.1% SLO budget limit"
          description: "AUTO reply failure rate exceeds 0.1% (99.9% SLO threshold), threatening automated customer replies."
          runbook: "docs/operations/incident-operating-model.md"

      - alert: FlowDeskEmergencyKillswitchTripped
        expr: emergency_killswitch_active > 0
        for: 0m
        labels:
          severity: p1
          owner: platform
        annotations:
          summary: "Emergency killswitch is active for tenant or global system"
          description: "Global or tenant emergency stop engaged. All automated outbound replies are halted until investigated and cleared."
          runbook: "docs/operations/incident-operating-model.md"

      - alert: FlowDeskAiDraftFailureRateHigh
        expr: sum(rate(ai_draft_runs_total{status="failed"}[5m])) / (sum(rate(ai_draft_runs_total[5m])) > 0 or 1) > 0.05
        for: 5m
        labels:
          severity: p2
          owner: ai
        annotations:
          summary: "AI draft generation error rate exceeds 5% SLO budget limit"
          description: "AI generation failure rate exceeds 5% over 5m window. Agents will need to compose manual responses."
          runbook: "docs/operations/provider-outage-playbook.md"

      - alert: FlowDeskRealtimeDisconnectionsElevated
        expr: sum(rate(realtime_reconnect_gaps_total[5m])) > 10
        for: 2m
        labels:
          severity: p2
          owner: platform
        annotations:
          summary: "Realtime reconnect gaps elevated; clients failing back to REST polling"
          description: "Elevated WebSocket reconnect gaps detected. Agents experiencing live update latency."
          runbook: "docs/operations/incident-operating-model.md"

      - alert: FlowDeskOutboxLagHigh
        expr: outbox_oldest_event_age_seconds > 5
        for: 2m
        labels:
          severity: p2
          owner: messaging
        annotations:
          summary: "Outbox processing lag exceeds 5s SLO target"
          description: "Outbox oldest event age exceeds 5 seconds, indicating queue processing backlog."
          runbook: "docs/runbooks/whatsapp-outbox-dlq.md"
