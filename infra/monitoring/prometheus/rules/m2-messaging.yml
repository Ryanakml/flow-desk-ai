groups:
  - name: flowdesk-m2-messaging
    rules:
      - alert: FlowDeskOutboxBacklogCritical
        expr: outbox_pending_events > 1000 or outbox_oldest_event_age_seconds > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: FlowDesk outbound queue is critically delayed
          runbook: docs/runbooks/whatsapp-outbox-dlq.md
      - alert: FlowDeskMessagingDLQNotEmpty
        expr: outbox_dead_letter_events > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: FlowDesk has failed outbound intents requiring review
          runbook: docs/runbooks/whatsapp-outbox-dlq.md
      - alert: FlowDeskWebhookFailureRateHigh
        expr: sum(rate(whatsapp_webhook_processed_total{result="failed"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp webhook processing failures are elevated
          runbook: docs/runbooks/whatsapp-outbox-dlq.md
