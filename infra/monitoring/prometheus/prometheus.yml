global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: flowdesk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
  - job_name: flowdesk-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4002"]
